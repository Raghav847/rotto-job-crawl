services:
  crawler:
    profiles: ["crawler"]
    build: .
    init: true
    shm_size: 1gb
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rotto}
      POSTGRES_USER: ${POSTGRES_USER:-rotto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotto-local}
      DATABASE_URL: ${DATABASE_URL:-}
      TEST_DATABASE_ADMIN_URL: ${TEST_DATABASE_ADMIN_URL:-}
      PROXY_URL: ${PROXY_URL:-}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-7777}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      PROXY_COST_PER_GB_USD: ${PROXY_COST_PER_GB_USD:-}
      CRAWL_SOURCES: ${CRAWL_SOURCES:-linkedin,reed,indeed}
      CRAWL_QUERIES: ${CRAWL_QUERIES:-software engineer,data engineer}
      CRAWL_LOCATIONS: ${CRAWL_LOCATIONS:-United Kingdom}
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-2}
      CRAWL_DISCOVERY: ${CRAWL_DISCOVERY:-auto}
      CRAWL_MAX_DETAILS: ${CRAWL_MAX_DETAILS:-20}
      CRAWL_MAX_REQUESTS: ${CRAWL_MAX_REQUESTS:-300}
      CRAWL_MAX_SECONDS: ${CRAWL_MAX_SECONDS:-600}
      CRAWL_REQUEST_DELAY: ${CRAWL_REQUEST_DELAY:-2}
      CRAWL_SAVE_PAGES: ${CRAWL_SAVE_PAGES:-0}
      CRAWL_FORCE_REFRESH: ${CRAWL_FORCE_REFRESH:-0}
      CRAWL_REFRESH_IDS: ${CRAWL_REFRESH_IDS:-}
      DETAIL_REFRESH_HOURS: ${DETAIL_REFRESH_HOURS:-24}
      INDEED_FETCH_MODE: ${INDEED_FETCH_MODE:-browser}
      INDEED_HEADLESS: ${INDEED_HEADLESS:-1}
      INDEED_RESOURCE_POLICY: ${INDEED_RESOURCE_POLICY:-lean}
      INDEED_MAX_PAGES: ${INDEED_MAX_PAGES:-1}
      CRAWL_MODE: ${CRAWL_MODE:-live}
      PROBE_BROWSER: ${PROBE_BROWSER:-0}
      PROBE_SOURCES: ${PROBE_SOURCES:-indeed,linkedin,reed}
      PROBE_DETAIL_INDEX: ${PROBE_DETAIL_INDEX:-0}
      BROWSER_STICKY: ${BROWSER_STICKY:-0}
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-1}
      BROWSER_CHANNEL: ${BROWSER_CHANNEL:-}
      BROWSER_STANDARD_UA: ${BROWSER_STANDARD_UA:-0}
      BROWSER_AUTOMATION_COMPAT: ${BROWSER_AUTOMATION_COMPAT:-0}
      BROWSER_DETAIL_MODE: ${BROWSER_DETAIL_MODE:-browser_inline}
      BROWSER_WARMUP: ${BROWSER_WARMUP:-0}
      BROWSER_MAX_REQUESTS: ${BROWSER_MAX_REQUESTS:-120}
      BROWSER_MAX_SECONDS: ${BROWSER_MAX_SECONDS:-85}
      BROWSER_MAX_BYTES: ${BROWSER_MAX_BYTES:-10000000}
    volumes:
      - ./output:/app/output
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rotto}
      POSTGRES_USER: ${POSTGRES_USER:-rotto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotto-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
